name: mountclimb
description: MountClimb - Aplikasi pemesanan tiket pendakian gunung.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0                  # panggilan REST API ke Supabase
  shared_preferences: ^2.2.0    # menyimpan sesi login di HP

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
